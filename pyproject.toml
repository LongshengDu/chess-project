[project]
name = "chess-project"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1,<4",
    "ipykernel>=7.3.0",
    "maia3",
    "matplotlib>=3.9,<4",
    "numpy>=1.26",
    "openai-codex==0.155.1",
    "python-chess==1.999",
    "PyYAML>=6.0,<7",
    "scipy>=1.14,<2",
    "stockfish>=5.2.0",
    "torch>=2.8",
    "Werkzeug>=3.1,<4",
]

[project.optional-dependencies]
profiling = ["matplotlib>=3.9,<4"]
cuda = ["torch>=2.8; (sys_platform == 'win32' or sys_platform == 'linux') and (platform_machine == 'AMD64' or platform_machine == 'x86_64')"]

[tool.uv]
package = false

[tool.uv.sources]
maia3 = { path = "deps/maia" }
torch = [{ index = "pytorch-cu130", extra = "cuda", marker = "(sys_platform == 'win32' or sys_platform == 'linux') and (platform_machine == 'AMD64' or platform_machine == 'x86_64')" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
